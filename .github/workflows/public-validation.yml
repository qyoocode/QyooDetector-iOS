name: Public validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify fixture integrity
        run: python3 scripts/verify_sources.py
      - name: Build and test package
        run: swift test
      - name: Compile generic iOS Simulator target
        run: xcodebuild -scheme QyooDetector -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/apple-simulator build CODE_SIGNING_ALLOWED=NO
      - name: Compile generic iOS device target
        run: xcodebuild -scheme QyooDetector -destination 'generic/platform=iOS' -derivedDataPath .build/apple-device build CODE_SIGNING_ALLOWED=NO
